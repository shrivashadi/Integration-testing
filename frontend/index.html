<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Todo App - Frontend</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 500px; margin: 50px auto; }
  li { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid #ddd; }
  .completed { text-decoration: line-through; color: gray; }
  input { padding: 8px; width: 70%; }
  button { padding: 8px 12px; cursor: pointer; }
</style>
</head>
<body>
  <h1>My Todo List</h1>
  <input type="text" id="todoInput" placeholder="Naya task likho...">
  <button onclick="addTodo()">Add</button>
  <ul id="todoList"></ul>

<script>
  // Backend ka base URL — yahi frontend-backend ka connection point hai
  const API_URL = 'http://localhost:5000/api/todos';

  async function fetchTodos() {
    const res = await fetch(API_URL);
    const todos = await res.json();
    renderTodos(todos);
  }

  async function addTodo() {
    const input = document.getElementById('todoInput');
    const title = input.value;

    await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title })
    });

    input.value = '';
    fetchTodos();
  }

  async function completeTodo(id) {
    await fetch(`${API_URL}/${id}`, { method: 'PUT' });
    fetchTodos();
  }

  async function deleteTodo(id) {
    await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
    fetchTodos();
  }

  function renderTodos(todos) {
    const list = document.getElementById('todoList');
    list.innerHTML = '';
    todos.forEach(todo => {
      const li = document.createElement('li');
      li.innerHTML = `
        <span class="${todo.completed ? 'completed' : ''}">${todo.title}</span>
        <span>
          <button onclick="completeTodo(${todo.id})">✔</button>
          <button onclick="deleteTodo(${todo.id})">✘</button>
        </span>
      `;
      list.appendChild(li);
    });
  }

  fetchTodos();
</script>
</body>
</html>
